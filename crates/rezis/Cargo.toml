[package]
name = "rezis"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "NestJS-inspired Rust backend framework for clean, modular APIs."

[dependencies]
axum = "0.8"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
